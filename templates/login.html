{% extends 'auth_base.html' %}
{% block content %}<p class="eyebrow">ÁREA DE GESTÃO</p><h1>Bom ter você por aqui<span class="heading-dot">.</span></h1><p>Informe a senha de acesso para gerenciar o laboratório.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}<div class="field"><label for="password">Senha de acesso</label><input id="password" name="password" type="password" required autocomplete="current-password" autofocus></div><button class="button button-primary" type="submit">Entrar no Circula {{ icon('arrow') }}</button></form>{% endblock %}
